# Keeps the Supabase project from auto-pausing.
#
# Free-tier projects pause after ~7 days without a database request. This
# runs a tiny read against the pins table every two days so the timer never
# expires. Row-level security means the anon key gets an empty array back,
# which is fine: the query still executes in Postgres, and that is what counts.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       — same value as NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_ANON_KEY  — same value as NEXT_PUBLIC_SUPABASE_ANON_KEY
name: Supabase keepalive

on:
  schedule:
    # 03:17 UTC every other day. Off the hour on purpose: GitHub delays
    # and sometimes drops runs scheduled exactly on :00.
    - cron: "17 3 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets must be set"
            exit 1
          fi
          status=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/pins?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${status}"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase responded with HTTP ${status}"
            cat /tmp/body
            exit 1
          fi
